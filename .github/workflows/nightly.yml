# Rolling nightly: every push to main is built, tested and packaged, and replaces the single
# "nightly" pre-release (releases/tag/nightly). A failing build or test publishes nothing.
name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Version
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "VERSION=nightly-$short" >> $env:GITHUB_ENV
          "SHORT_SHA=$short" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: cmake -S . -B out -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release "-DREZ_GAZE_VERSION=$env:VERSION"

      - name: Build
        shell: pwsh
        run: cmake --build out

      - name: Test
        shell: pwsh
        run: ctest --test-dir out --output-on-failure

      - name: Package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File release/package.ps1 -Out out -Version $env:VERSION -Dest dist

      - name: Publish nightly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $subject = git log -1 --format=%s
          $notes = @"
          Rolling nightly build of main at $env:SHORT_SHA: $subject

          Built and tested by CI; replaced on every push. Experimental.
          Install: unzip, close Rez, run install.ps1 (see README.txt inside).
          "@
          gh release delete nightly --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create nightly "dist/rez-gaze-$env:VERSION.zip" --prerelease --target $env:GITHUB_SHA `
            --title "Nightly $env:SHORT_SHA" --notes $notes
