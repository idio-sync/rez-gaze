; rez-gaze settings. Reread every second while Rez runs (helper settings at start).
[rez_gaze]
; log: change nothing, only log | head: aim where the head points | gaze: aim where the eyes look
; calibrate: hold your eyes on the frozen cursor and slowly move your head for 15 s; the result is
; saved below as calib= and the mode returns to gaze
mode=gaze
; start (or cancel) calibration from the controllers: hold both thumbsticks down for 2 s
; (calib_combo=one: either thumbstick, 3 s). A short buzz = started, a double buzz = saved,
; a long buzz = cancelled. calib_hold_s=0 turns the combination off.
calib_combo=both
calib_hold_s=2
; which controller(s) carry the aim
hand=both
; undo Rez's 39.4 degree tilt for Oculus-type controllers (auto) or a fixed number of degrees
tilt=auto
; hand trims in degrees, positive = right / up (calibration resets them)
yaw=0
pitch=0
; gaze scale, if the cursor doesn't reach the edges (calibration resets them)
gain_yaw=1
gain_pitch=1
; smoothing: ema (smooth_ms) or euro (One Euro: steady at rest, quick in eye jumps)
filter=ema
smooth_ms=40
euro_min_cutoff=1.0
euro_beta=0.05
; gaze source: auto (helper, else Steam Link OSC, else straight ahead), helper, osc
source=auto
; start the helper (rez_gaze\rez_gaze_helper.exe) this many seconds after VR starts
helper=1
helper_delay_s=10
; Steam Link OSC port
port=9000
